<!doctype html>
<html lang="es" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>DiscographyX · El archivo del metal</title>
    <meta
      name="description"
      content="Buscá tu banda, descubrí su discografía y recorré cada álbum, portada y canción. El archivo del heavy metal y el death metal."
    />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101012" />
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="/content/images/discographyx.svg" />
    <link rel="manifest" href="/manifest.webapp" />
    <link rel="stylesheet" href="/content/css/loading.css" />
  </head>
  <body>
    <jhi-app>
      <div class="app-loading" role="status" style="color: #ed3638; text-align: center; padding: 64px; font-family: sans-serif">
        <h1>DISCOGRAPHYX</h1>
        <p>Abriendo el archivo del metal…</p>
        <p id="dx-loading-error" hidden>La carga está tardando más de lo esperado. Probá recargar la página.</p>
      </div>
    </jhi-app>
    <noscript><p>Activá JavaScript para explorar DiscographyX.</p></noscript>
    <script>
      window.addEventListener('load', function () {
        setTimeout(function () {
          const message = document.getElementById('dx-loading-error');
          if (message) message.hidden = false;
        }, 15000);
      });
    </script>
  </body>
</html>
